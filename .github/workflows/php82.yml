on:
  release:
    types:
      - created

name: Build PHP 8.2

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant:
          - platform: 'linux/amd64,linux/arm64'
            image: 8.2-cli-alpine3.21
            tags: |
              ghcr.io/php-etl/php-grpc:8.2-cli
          - platform: 'linux/amd64,linux/arm64'
            image: 8.2-zts-alpine3.21
            tags: |
              ghcr.io/php-etl/php-grpc:8.2-zts

    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_LOGIN }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push PHP 8.2
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.variant.platform }}
          build-args: |
            PHP_IMAGE=${{ matrix.variant.image }}
          tags: ${{ matrix.variant.tags }}

  build_xdebug:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant:
          - platform: 'linux/amd64,linux/arm64'
            image: 8.2-cli-alpine3.21
            tags: |
              ghcr.io/php-etl/php-grpc:8.2-cli-xdebug
          - platform: 'linux/amd64,linux/arm64'
            image: 8.2-zts-alpine3.21
            tags: |
              ghcr.io/php-etl/php-grpc:8.2-zts-xdebug

    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_LOGIN }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Build and push PHP 8.2 with Xdebug
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.variant.platform }}
          build-args: |
            PHP_IMAGE=${{ matrix.variant.image }}
            XDEBUG_ENABLED=true
          tags: ${{ matrix.variant.tags }}
